<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorite quotes movie</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <section id="head">
      <h1>Favorite citation in Movie</h1>
      <h2>Online citation manager</h2>
      <h3 id="count">0 citation</h3>
      <hr />
    </section>
    <form id="submit" action="" method="">
      <label for="citation"
        >Type the character's name, add a colon, and their punchline in
        quotation marks </label
      ><br />
      <input
        id="citation"
        type="text"
        name="citation"
        placeholder="Type in your favorite movie quote :"
      /><br />
      <label for="nameMovie">Give the name of the film from this quote : </label
      ><br />
      <input
        id="namemovie"
        type="text"
        name="movie"
        placeholder="Give the name movie"
      /><br />
      <button type="submit" id="givequote"><b>Submit quotes</b></button>
    </form>
    <hr />
    <div id="quote-list">
      <div class="quote">
        <p class="text">
          Cecilia: Obviously, Doctor, you've never been a 13-year-old girl.<br />
        </p>
        <p class="movie">Virgin Suicides</p>
      </div>
    </div>
    <hr />
  </body>
  <script src="script.js"></script>
</html>
